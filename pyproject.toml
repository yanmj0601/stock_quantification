[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-quantification"
version = "0.2.0"
description = "EvoQuant: multi-market quant research and paper-trading platform."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "psycopg2-binary>=2.9",
    "requests>=2.32",
    "yfinance>=0.2",
    "baostock>=0.9.3",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
]
ops = [
    "paramiko>=3.5",
]

[project.scripts]
evoquant = "evoquant.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
